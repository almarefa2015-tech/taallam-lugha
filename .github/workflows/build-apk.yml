name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['lib/**', 'assets/**', 'pubspec.yaml', 'tools/ci/**', '.github/workflows/build-apk.yml']
permissions:
  contents: write
concurrency: { group: build-apk, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Generate Android project
        run: |
          flutter create --org com.khaled --project-name taallam_lugha --platforms android .
          rm -rf test
          python3 tools/ci/patch_android.py
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Publish to release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "تعلم لغة - آخر نسخة للتجربة"
          prerelease: true
          make_latest: true
          files: build/app/outputs/flutter-apk/app-release.apk
          body: "Build ${{ github.run_number }} from ${{ github.sha }}"
